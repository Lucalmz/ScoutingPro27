name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            jpackage-type: msi
          - os: macos-latest      # Apple Silicon (arm64)
            os-name: mac-arm64
            jpackage-type: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- 前端构建 (vite 会直接输出到 Backend/src/main/resources/public) ----------
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---------- 第一次打包：只为了拿到能跑的 jar 去预热 JCEF ----------
      - name: Build fat jar (pass 1, for prewarm)
        working-directory: Backend
        run: mvn -B clean package -DskipTests

      - name: Prewarm JCEF native bundle (real download for this OS)
        working-directory: Backend
        run: java -jar target/ScoutingPro27.jar --jcef-prewarm

      - name: Package jcef bundle as a resource
        shell: bash
        working-directory: Backend
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            tar -czf src/main/resources/jcef-bundle.tar.gz -C jcef-bundle .
          else
            jar --create --file=src/main/resources/jcef-bundle.zip -C jcef-bundle .
          fi

      # ---------- 第二次打包：这次内嵌了离线原生库 ----------
      - name: Build fat jar (pass 2, with embedded jcef bundle)
        working-directory: Backend
        run: mvn -B clean package -DskipTests

      # ---------- 提取应用版本号 (如 v0.1.0 -> 0.1.0) ----------
      - name: Determine App Version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
            # 保证 jpackage 接收符合规范的数字版本号
            CLEAN_VER=$(echo "$RAW_VER" | grep -oE '^[0-9]+(\.[0-9]+)*' || echo "0.1.0")
            echo "APP_VERSION=$CLEAN_VER" >> $GITHUB_ENV
          else
            echo "APP_VERSION=0.1.0" >> $GITHUB_ENV
            CLEAN_VER="0.1.0"
          fi
          # macOS jpackage DMG 规范要求主版本号必须为正整数 (>=1)，否则报 configuration problem 错误
          if [[ "${{ matrix.os-name }}" == mac* ]]; then
            MAC_VER="$CLEAN_VER"
            if [[ "$MAC_VER" =~ ^0\. ]]; then
              MAC_VER="1.${MAC_VER#0.}"
            fi
            echo "JPACKAGE_VERSION=$MAC_VER" >> $GITHUB_ENV
          else
            echo "JPACKAGE_VERSION=$CLEAN_VER" >> $GITHUB_ENV
          fi

      # ---------- 准备纯净的打包输入目录（避免 target 内的非 jar 文件导致打包异常） ----------
      - name: Prepare JPackage Input
        shell: bash
        working-directory: Backend
        run: |
          rm -rf dist-input
          mkdir -p dist-input
          cp target/ScoutingPro27.jar dist-input/

      # ---------- jpackage (Windows: 添加快捷方式、开始菜单和安装目录选择向导) ----------
      - name: Run jpackage (Windows)
        if: runner.os == 'Windows'
        working-directory: Backend
        run: >
          jpackage
          --type ${{ matrix.jpackage-type }}
          --name ScoutingPro27
          --app-version ${{ env.JPACKAGE_VERSION }}
          --input dist-input
          --main-jar ScoutingPro27.jar
          --main-class com.bear27570.app.Main
          --dest dist
          --icon src/main/resources/icon.ico
          --java-options "--add-opens=java.desktop/sun.awt=ALL-UNNAMED"
          --win-dir-chooser
          --win-shortcut
          --win-menu
          --win-menu-group ScoutingPro27

      # ---------- jpackage (macOS: 添加包标识与图标) ----------
      - name: Run jpackage (macOS)
        if: runner.os == 'macOS'
        working-directory: Backend
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     src/main/resources/icon.png --out icon.iconset/icon_16x16.png || true
          sips -z 32 32     src/main/resources/icon.png --out icon.iconset/icon_16x16@2x.png || true
          sips -z 32 32     src/main/resources/icon.png --out icon.iconset/icon_32x32.png || true
          sips -z 64 64     src/main/resources/icon.png --out icon.iconset/icon_32x32@2x.png || true
          sips -z 128 128   src/main/resources/icon.png --out icon.iconset/icon_128x128.png || true
          sips -z 256 256   src/main/resources/icon.png --out icon.iconset/icon_128x128@2x.png || true
          sips -z 256 256   src/main/resources/icon.png --out icon.iconset/icon_256x256.png || true
          sips -z 512 512   src/main/resources/icon.png --out icon.iconset/icon_256x256@2x.png || true
          sips -z 512 512   src/main/resources/icon.png --out icon.iconset/icon_512x512.png || true
          iconutil -c icns icon.iconset -o src/main/resources/icon.icns || true
          ICON_ARG=""
          if [ -f src/main/resources/icon.icns ]; then
            ICON_ARG="--icon src/main/resources/icon.icns"
          fi
          jpackage \
            --type ${{ matrix.jpackage-type }} \
            --name ScoutingPro27 \
            --app-version ${{ env.JPACKAGE_VERSION }} \
            --input dist-input \
            --main-jar ScoutingPro27.jar \
            --main-class com.bear27570.app.Main \
            --dest dist \
            $ICON_ARG \
            --java-options "--add-opens=java.desktop/sun.awt=ALL-UNNAMED" \
            --java-options "--add-opens=java.desktop/sun.lwawt=ALL-UNNAMED" \
            --java-options "--add-opens=java.desktop/sun.lwawt.macosx=ALL-UNNAMED" \
            --mac-package-identifier com.bear27570.app \
            --mac-package-name ScoutingPro27

      # ---------- 重命名安装包为 ScoutingPro27-[OS]-[version] 形式 ----------
      - name: Rename installer to ScoutingPro27-[OS]-[version]
        shell: bash
        working-directory: Backend/dist
        run: |
          for f in *; do
            if [ -f "$f" ]; then
              ext="${f##*.}"
              target_name="ScoutingPro27-${{ matrix.os-name }}-${{ env.APP_VERSION }}.${ext}"
              echo "Renaming $f -> $target_name"
              mv "$f" "$target_name"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os-name }}
          path: Backend/dist/*

  # ---------- 自动发布并挂载产物到 GitHub Release (Pre-release) ----------
  release:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: true