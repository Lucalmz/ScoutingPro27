name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: windows
            jpackage-type: msi
          - os: macos-latest      # Apple Silicon
            os-name: mac-arm64
            jpackage-type: dmg
          - os: macos-13          # Intel
            os-name: mac-x64
            jpackage-type: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- 前端构建 (vite 会直接输出到 Backend/src/main/resources/public) ----------
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # ---------- 第一次打包：只为了拿到能跑的 jar 去预热 JCEF ----------
      - name: Build fat jar (pass 1, for prewarm)
        working-directory: Backend
        run: mvn -B clean package -DskipTests

      - name: Prewarm JCEF native bundle (real download for this OS)
        working-directory: Backend
        run: java -jar target/ScoutingPro27.jar --jcef-prewarm

      - name: Package jcef bundle as a resource
        shell: bash
        working-directory: Backend
        run: jar --create --file=src/main/resources/jcef-bundle.zip -C jcef-bundle .

      # ---------- 第二次打包：这次内嵌了离线原生库 ----------
      - name: Build fat jar (pass 2, with embedded jcef bundle)
        working-directory: Backend
        run: mvn -B clean package -DskipTests

      # ---------- 提取应用版本号 (如 v0.0.1 -> 0.0.1) ----------
      - name: Determine App Version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF_NAME#v}"
            # 保证 jpackage 接收符合规范的数字版本号
            CLEAN_VER=$(echo "$RAW_VER" | grep -oE '^[0-9]+(\.[0-9]+)*' || echo "0.0.1")
            echo "APP_VERSION=$CLEAN_VER" >> $GITHUB_ENV
          else
            echo "APP_VERSION=0.0.1" >> $GITHUB_ENV
          fi

      # ---------- jpackage ----------
      - name: Run jpackage
        working-directory: Backend
        run: >
          jpackage
          --type ${{ matrix.jpackage-type }}
          --name ScoutingPro27
          --app-version ${{ env.APP_VERSION }}
          --input target
          --main-jar ScoutingPro27.jar
          --main-class com.bear27570.app.Main
          --dest dist

      # ---------- 重命名安装包以包含平台架构标识，防止 Mac 产物重名覆盖 ----------
      - name: Rename installer with platform name
        shell: bash
        working-directory: Backend/dist
        run: |
          for f in *; do
            if [ -f "$f" ]; then
              ext="${f##*.}"
              base="${f%.*}"
              mv "$f" "${base}-${{ matrix.os-name }}.${ext}"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os-name }}
          path: Backend/dist/*

  # ---------- 自动发布并挂载产物到 GitHub Release (Pre-release) ----------
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: true