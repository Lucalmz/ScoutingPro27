        <polygon points="300.00,346.00 343.30,371.00 343.30,421.00 300.00,446.00 256.70,421.00 256.70,371.00" 
                 fill="#000000" 
                 fill-opacity="0.4" />
        <circle cx="300.0" cy="396.0" r="2.5" fill="#39ff14" />
      

