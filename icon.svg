        <polygon points="189.15,335.00 241.98,365.50 241.98,426.50 189.15,457.00 136.32,426.50 136.32,365.50" 
                 fill="#39ff14" 
                 fill-opacity="0.9" 
                 stroke="#000000" 
                 stroke-width="3" 
                 filter="url(#neon-glow)" />
        <polygon points="189.15,346.00 232.45,371.00 232.45,421.00 189.15,446.00 145.85,421.00 145.85,371.00" 
                 fill="#000000" 
                 fill-opacity="0.4" />
        <circle cx="189.1" cy="396.0" r="2.5" fill="#39ff14" />
      

