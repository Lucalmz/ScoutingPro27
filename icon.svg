<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- True Neon Glow Filter -->
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="glow" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="softglow" />
      <feMerge>
        <feMergeNode in="softglow" />
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solid Pitch-Black Background -->
  <rect width="600" height="600" rx="48" fill="#000000" />

  <!-- Squircle Outer Frame -->
  <rect x="16" y="16" width="568" height="568" rx="80" fill="none" stroke="#39ff14" stroke-width="2" stroke-opacity="0.3" />
  <rect x="24" y="24" width="552" height="552" rx="72" fill="none" stroke="#39ff14" stroke-width="1" stroke-dasharray="20 12" stroke-opacity="0.2" />

  <!-- Outer Honeycomb Rosette Cluster (Surrounding Cells) -->
  <g class="surrounding-honeycomb">
    
        <!-- Solid Green Honeycomb Cell (Matching User Reference Image) -->
        <polygon points="189.15,143.00 241.98,173.50 241.98,234.50 189.15,265.00 136.32,234.50 136.32,173.50" 
                 fill="#39ff14" 
                 fill-opacity="0.9" 
                 stroke="#000000" 
                 stroke-width="3" 
                 filter="url(#neon-glow)" />
        <polygon points="189.15,154.00 232.45,179.00 232.45,229.00 189.15,254.00 145.85,229.00 145.85,179.00" 
                 fill="#000000" 
                 fill-opacity="0.4" />
        <circle cx="189.1" cy="204.0" r="2.5" fill="#39ff14" />
      

        <!-- Solid Green Honeycomb Cell (Matching User Reference Image) -->
        <polygon points="300.00,143.00 352.83,173.50 352.83,234.50 300.00,265.00 247.17,234.50 247.17,173.50" 
                 fill="#39ff14" 
                 fill-opacity="0.9" 
                 stroke="#000000" 
                 stroke-width="3" 
                 filter="url(#neon-glow)" />
        <polygon points="300.00,154.00 343.30,179.00 343.30,229.00 300.00,254.00 256.70,229.00 256.70,179.00" 
                 fill="#000000" 
                 fill-opacity="0.4" />
        <circle cx="300.0" cy="204.0" r="2.5" fill="#39ff14" />
      

        <!-- Solid Green Honeycomb Cell (Matching User Reference Image) -->
        <polygon points="410.85,143.00 463.68,173.50 463.68,234.50 410.85,265.00 358.02,234.50 358.02,173.50" 
                 fill="#39ff14" 
                 fill-opacity="0.9" 
                 stroke="#000000" 
                 stroke-width="3" 
