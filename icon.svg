        <polygon points="410.85,154.00 454.15,179.00 454.15,229.00 410.85,254.00 367.55,229.00 367.55,179.00" 
                 fill="#000000" 
                 fill-opacity="0.4" />
        <circle cx="410.9" cy="204.0" r="2.5" fill="#39ff14" />
      

        <!-- Solid Green Honeycomb Cell (Matching User Reference Image) -->
        <polygon points="133.72,239.00 186.55,269.50 186.55,330.50 133.72,361.00 80.90,330.50 80.90,269.50" 
                 fill="#39ff14" 
                 fill-opacity="0.9" 
                 stroke="#000000" 
                 stroke-width="3" 
                 filter="url(#neon-glow)" />
        <polygon points="133.72,250.00 177.02,275.00 177.02,325.00 133.72,350.00 90.42,325.00 90.42,275.00" 
                 fill="#000000" 
                 fill-opacity="0.4" />
        <circle cx="133.7" cy="300.0" r="2.5" fill="#39ff14" />
      

