        <circle cx="410.9" cy="396.0" r="2.5" fill="#39ff14" />
      
  </g>

  <!-- Center Core SP27 Hexagons -->
  <g class="sp27-core">
    
    <!-- Left Hexagon Outer Shell -->
    <polygon points="244.57,238.00 298.27,269.00 298.27,331.00 244.57,362.00 190.88,331.00 190.88,269.00" 
             fill="#030803" 
             stroke="#39ff14" 
             stroke-width="4" 
             filter="url(#neon-glow)" />
    <!-- Tactical Corner Cutouts -->
    <line x1="220.57437415779594" y1="238" x2="268.57437415779594" y2="238" stroke="#000" stroke-width="6" />
    <line x1="220.57437415779594" y1="362" x2="268.57437415779594" y2="362" stroke="#000" stroke-width="6" />
  
    
    <!-- Right Hexagon Outer Shell -->
    <polygon points="355.43,238.00 409.12,269.00 409.12,331.00 355.43,362.00 301.73,331.00 301.73,269.00" 
             fill="#030803" 
             stroke="#39ff14" 
             stroke-width="4" 
             filter="url(#neon-glow)" />
    <!-- Tactical Corner Cutouts -->
    <line x1="331.42562584220406" y1="238" x2="379.42562584220406" y2="238" stroke="#000" stroke-width="6" />
    <line x1="331.42562584220406" y1="362" x2="379.42562584220406" y2="362" stroke="#000" stroke-width="6" />
  
    
    <!-- S Glyph (Hex-formed) -->
    <path d="M 238.57437415779594 250
             L 202.57437415779594 270
             L 202.57437415779594 290
             L 238.57437415779594 296
             L 238.57437415779594 304
             L 202.57437415779594 310
             L 202.57437415779594 330
             L 238.57437415779594 350"
          fill="none" 
          stroke="#39ff14" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neon-glow)" />
  
    
    <!-- P Glyph (Hex-formed) -->
    <!-- Vertical Spine -->
    <path d="M 244.57437415779594 250
             L 244.57437415779594 350"
          fill="none" 
          stroke="#39ff14" 
          stroke-width="9" 
          stroke-linecap="round" 
          filter="url(#neon-glow)" />
    <!-- Loop -->
    <path d="M 244.57437415779594 250
             L 282.57437415779594 270
             L 282.57437415779594 294
             L 244.57437415779594 302"
          fill="none" 
          stroke="#39ff14" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neon-glow)" />
  
    
    <!-- 2 Glyph (Hex-formed) -->
    <path d="M 317.42562584220406 270
             L 347.42562584220406 250
             L 349.42562584220406 288
             L 317.42562584220406 328
             L 349.42562584220406 328"
          fill="none" 
          stroke="#39ff14" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neon-glow)" />
  
    
    <!-- 7 Glyph (Hex-formed) -->
    <path d="M 355.42562584220406 250
             L 397.42562584220406 250
             L 365.42562584220406 350"
          fill="none" 
          stroke="#39ff14" 
          stroke-width="9" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#neon-glow)" />
    <!-- 7 Middle Cyber Notch -->
    <line x1="371.42562584220406" y1="304" x2="389.42562584220406" y2="304" 
          stroke="#39ff14" stroke-width="6" stroke-linecap="round" filter="url(#neon-glow)" />
  
    
    <!-- Inter-hex Cyber Pulse Bridge -->
    <line x1="264.57437415779594" y1="316" x2="335.42562584220406" y2="292" 
          stroke="#39ff14" stroke-width="5" stroke-linecap="round" filter="url(#neon-glow)" />
  
